<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <header class="head">
        <span class="brand">Job Tracker</span>
      </header>

      <section id="view-idle" class="view" hidden>
        <p id="page-title" class="page-title"></p>
        <p id="page-host" class="muted"></p>
        <button id="track" class="primary" type="button">Track application</button>
      </section>

      <section id="view-loading" class="view" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text" role="status">Reading the page and filling in the details…</p>
      </section>

      <section id="view-result" class="view" hidden>
        <p id="result-status" class="status"></p>
        <p id="result-title" class="result-title"></p>
        <p id="result-sub" class="muted"></p>
        <div id="result-review" class="review" hidden>
          <p class="review-label">Worth a look later</p>
          <ul id="result-reasons" class="reasons"></ul>
        </div>
        <div class="actions">
          <a id="open-tracker" class="button primary" target="_blank" rel="noopener">Open in tracker</a>
          <button id="undo" class="secondary" type="button">Undo</button>
        </div>
      </section>

      <section id="view-confirm" class="view" hidden>
        <p class="status">This doesn't look like a single job posting.</p>
        <p class="muted">It may be a list of jobs or another kind of page. Add it anyway?</p>
        <div class="actions">
          <button id="confirm-add" class="primary" type="button">Add anyway</button>
          <button id="confirm-cancel" class="secondary" type="button">Cancel</button>
        </div>
      </section>

      <section id="view-error" class="view" hidden>
        <p id="error-message" class="error" role="alert"></p>
        <div class="actions">
          <a id="sign-in" class="button primary" target="_blank" rel="noopener" hidden>Sign in</a>
          <button id="retry" class="secondary" type="button" hidden>Try again</button>
        </div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
