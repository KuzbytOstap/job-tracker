<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="app" class="popup" data-state="idle">
      <div class="aurora" aria-hidden="true"></div>

      <header class="head">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
            <defs>
              <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#c2410c" />
                <stop offset="1" stop-color="#be123c" />
              </linearGradient>
            </defs>
            <rect width="24" height="24" rx="7" fill="url(#logo-gradient)" />
            <path
              d="M14.5 6.5v7a3 3 0 0 1-6 0"
              fill="none"
              stroke="#fff"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="brand" data-i18n="brand"></span>
        <div class="lang" role="group" data-i18n-label="language">
          <button type="button" class="lang-button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" class="lang-button" data-lang="uk" aria-pressed="false">УК</button>
        </div>
      </header>

      <div id="stage" class="stage" aria-hidden="true">
        <div class="float">
          <div id="deck" class="deck">
            <div class="card card-3"></div>
            <div class="card card-2"></div>
            <div class="card card-1">
              <div class="card-row">
                <span id="monogram" class="monogram">J</span>
                <span id="card-host" class="host"></span>
              </div>
              <div class="lines"><i></i><i></i><i></i></div>
              <span class="scan"></span>
            </div>
            <div class="badge">
              <svg class="glyph glyph-check" viewBox="0 0 24 24" width="22" height="22" focusable="false">
                <path d="M6 12.5l4 4 8-9" />
              </svg>
              <svg class="glyph glyph-question" viewBox="0 0 24 24" width="22" height="22" focusable="false">
                <path d="M9.2 9.2a2.9 2.9 0 1 1 4.2 2.6c-.9.5-1.4 1-1.4 2" />
                <path d="M12 17.2v.1" />
              </svg>
              <svg class="glyph glyph-alert" viewBox="0 0 24 24" width="22" height="22" focusable="false">
                <path d="M12 7v6.5" />
                <path d="M12 17.2v.1" />
              </svg>
            </div>
            <div id="sparks" class="sparks"></div>
          </div>
        </div>
      </div>

      <section id="view-idle" class="view" hidden>
        <p id="page-title" class="page-title"></p>
        <p class="muted" data-i18n="idleHint"></p>
        <button id="track" class="btn btn-primary" type="button" data-i18n="idleCta"></button>
      </section>

      <section id="view-loading" class="view" hidden>
        <p id="loading-text" class="loading-text" aria-hidden="true"></p>
        <p class="sr-only" role="status" data-i18n="working"></p>
        <div class="progress" aria-hidden="true"><span></span></div>
      </section>

      <section id="view-result" class="view" hidden>
        <p id="result-status" class="status" role="status"></p>
        <p id="result-title" class="result-title"></p>
        <p id="result-sub" class="muted"></p>
        <div id="result-review" class="review" hidden>
          <p class="review-label" data-i18n="reviewLabel"></p>
          <ul id="result-reasons" class="reasons"></ul>
        </div>
        <div class="actions">
          <a id="open-tracker" class="btn btn-primary" target="_blank" rel="noopener" data-i18n="openTracker"></a>
          <button id="undo" class="btn btn-secondary" type="button" data-i18n="undo"></button>
        </div>
      </section>

      <section id="view-confirm" class="view" hidden>
        <p class="status" data-i18n="confirmTitle"></p>
        <p class="muted" data-i18n="confirmBody"></p>
        <div class="actions">
          <button id="confirm-add" class="btn btn-primary" type="button" data-i18n="confirmAdd"></button>
          <button id="confirm-cancel" class="btn btn-secondary" type="button" data-i18n="cancel"></button>
        </div>
      </section>

      <section id="view-error" class="view" hidden>
        <p id="error-message" class="status" role="alert"></p>
        <div class="actions">
          <a id="sign-in" class="btn btn-primary" target="_blank" rel="noopener" data-i18n="signInCta" hidden></a>
          <button id="retry" class="btn btn-secondary" type="button" data-i18n="retry" hidden></button>
        </div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
